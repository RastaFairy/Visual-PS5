; helixsr.ini - optional, next to HelixSR's DLL. Every setting has a default; restart the game after a change.
; With HelixSR Scaler, change Int8 and WaveSize in OptiScaler.ini [HelixSR]: it writes them here at every game start.

[Upscaling]
; INT8 network: auto = on for GPUs with fast integer dot products, off elsewhere; on / off to force it
Int8 = auto
; Ultra Performance: fast = the network outputs twice the render size, a Lanczos pass scales it to the screen
; (default, about a third less GPU time); full = the network outputs the screen size (sharper, as DLSS)
NetworkResolution = fast

[Sharpening]
; DLSS does not sharpen, so the default is off. rcas = AMD FSR's sharpening, nvidia = NVIDIA Image Scaling's
Sharpener = off
; Strength 0.0 - 1.0
Sharpness = 0.5

[Compatibility]
; Wave size of the network shaders: auto (32, or 64 on GPUs without 32-lane waves), 32 or 64
WaveSize = auto

[Log]
; helixsr.log next to the DLL (attach it to problem reports)
Enabled = true
