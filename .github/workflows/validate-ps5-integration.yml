name: Validate PS5 Homebrew Studio integrations

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check PS5-Homebrew-Studio/app.js
          node --check PS5-Homebrew-Studio/runtime/native-generator.js

      - name: Test native code generator
        shell: pwsh
        run: node PS5-Homebrew-Studio/runtime/test-native-generator.js

      - name: Validate WSL repair helper syntax
        shell: bash
        run: bash -n PS5-Homebrew-Studio/runtime/fix-wsl-permissions.sh

      - name: Parse PowerShell server
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "PS5-Homebrew-Studio/runtime/server.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ($_.ToString()) }
            exit 1
          }
          Write-Host "PowerShell parser: OK"
      - name: Parse PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "PS5-Homebrew-Studio/runtime/server.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ($_.ToString()) }
            exit 1
          }
          Write-Host "Windows PowerShell 5.1 parser: OK"

      - name: Check integration routes and UI hooks
        shell: pwsh
        run: |
          $server = Get-Content -Raw PS5-Homebrew-Studio/runtime/server.ps1
          $app = Get-Content -Raw PS5-Homebrew-Studio/app.js
          $requiredServer = @(
            "function GetIntegrationConfig",
            "function SetIntegrationConfig",
            "function PackageNativeProjectWithUltraPack",
            "function InstallVulkanTextureRuntime",
            "function GetProjectEbootFolders",
            "'/api/integrations'",
            "'/api/integration-config'",
            "'/api/package-ultrapack/start'",
            "function GetNativePresentationState",
            "function UpdateNativePresentationAssets",
            "'/api/native-presentation-assets'",
            "function GetWslDrvFsMetadataState",
            "function GetWslPermissionRepairInstructions",
            "fix-wsl-permissions.sh",
            "Operation not permitted",
            "wsl --shutdown",
            "function NormalizeNativeBuildFiles",
            "canonical Makefile target",
            '$makeBuildCall',
            '$buildText = $buildText.Replace($legacyBuildCall, $makeBuildCall)',
            "core.autocrlf=false",
            "*.sha256 text eol=lf",
            '$psi.EnvironmentVariables[',
            '$psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8',
            'if ($verifyEnabled) { $cliArgs += ''--verify'' }'
          )
          foreach ($needle in $requiredServer) {
            if (-not $server.Contains($needle)) { throw "Missing server integration: $needle" }
          }
          foreach ($needle in @("api('integrations')", "api('package-ultrapack/start'", "function openIntegrationSettings", "api('package-ultrapack/start',{path,format})", "function closeCurrentProject", "nativeCleanBeforeBuild", "data-native-needs-init", "function openNativePresentationEditor", "api('native-presentation-assets'", "presentationSelectionFile", "presentationLaunchFile")) {
            if (-not $app.Contains($needle)) { throw "Missing UI integration: $needle" }
          }
          $collectionSelector = 'buttons=' + [char]36 + [char]36 + '(' + [char]39 + '#modalActions button' + [char]39 + ')'
          if (-not $app.Contains($collectionSelector)) {
            throw "UltraPack modal must use querySelectorAll to manage its action-button collection."
          }
          if ($server -match 'RunKytyProject|kytyExe|/api/run-kyty' -or $app -match 'runNativeKyty|postBuildKyty|kyty_emulator|/api/run-kyty') {
            throw "The retired emulator integration remains in active runtime code."
          }
          if ($app.Contains("const buttons=$('#modalActions button')") -or $app.Contains("$('#modalActions button').find")) {
            throw "A single querySelector result is being used as a collection."
          }
          if ($app.Contains("safeIds.add(")) { throw "Image asset IDs must be managed with Map.set, not Set.add." }
          if (-not $app.Contains("safeIds.set(id,rawId)")) { throw "Missing image asset ID Map registration." }
          $generator = Get-Content -Raw PS5-Homebrew-Studio/runtime/native-generator.js
          if ($generator.Contains("void load_textures() {}") -or $generator.Contains("target component was not resolved") -or $generator.Contains("unsupported visual action")) {
            throw "The native generator still contains empty texture stubs or orphan flow fallbacks."
          }
          if ($app.Contains('id="ultraPackVerify"') -or $app.Contains("api('package-ultrapack/start',{path,format,verify})")) {
            throw "UltraPack UI must preserve the known-good CLI invocation and must not force --verify."
          }
          if (-not $server.Contains("function GetProjectProfile") -or -not $server.Contains("function InitializeNativeProjectFolder") -or -not $server.Contains("cleanBeforeBuild")) {
            throw "Native project type detection, initialization or guarded clean workflow is missing."
          }
          $wslFix = Get-Content -Raw PS5-Homebrew-Studio/runtime/fix-wsl-permissions.sh
          foreach ($needle in @("set -euo pipefail", "/etc/wsl.conf", "metadata", "backup")) {
            if (-not $wslFix.Contains($needle)) { throw "Missing WSL permission repair script marker: $needle" }
          }
          Write-Host "Integration server/UI contract: OK"

      - name: Check version metadata
        shell: pwsh
        run: |
          $version = (Get-Content PS5-Homebrew-Studio/VERSION.txt | Where-Object { $_ -match '^Version:' }) -replace '^Version:\s*',''
          $html = Get-Content -Raw PS5-Homebrew-Studio/index.html
          if ($version -ne '1.1.3' -or -not $html.Contains('VERSION 1.1.3')) {
            throw "Version mismatch: VERSION.txt=$version"
          }
          Write-Host "Version 1.1.3: OK"

      - name: Package Studio release archive
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feat/')) && success()
        shell: pwsh
        run: |
          $version = (Get-Content PS5-Homebrew-Studio/VERSION.txt | Where-Object { $_ -match '^Version:' }) -replace '^Version:\s*',''
          $source = (Resolve-Path PS5-Homebrew-Studio).Path
          $archiveName = "PS5-Homebrew-Studio-v$version.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($source, $archive, [IO.Compression.CompressionLevel]::Optimal, $true)
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$archive.sha256"
          [IO.File]::WriteAllText($checksum, "$digest *$archiveName`n", [System.Text.UTF8Encoding]::new($false))
          "STUDIO_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "STUDIO_CHECKSUM=$checksum" >> $env:GITHUB_ENV

      - name: Upload Studio release artifact
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feat/')) && success()
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Homebrew-Studio-v1.1.3
          path: |
            ${{ runner.temp }}/PS5-Homebrew-Studio-v*.zip
            ${{ runner.temp }}/PS5-Homebrew-Studio-v*.zip.sha256
          if-no-files-found: error
          retention-days: 30
