name: Validate IDE runtime and package source

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/native-generator.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/layer-model.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/unicode-fonts.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/native-modification-policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/project-contracts.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run JavaScript regression tests
        shell: pwsh
        run: |
          $tests = @(
            'runtime/test-layer-model.js',
            'runtime/test-native-generator.js',
            'runtime/test-structure-explorer.js',
            'runtime/test-unicode-fonts.js',
            'runtime/test-unicode-integration.js',
            'runtime/test-native-modification-policy.js',
            'runtime/test-project-contracts.js',
            'runtime/test-api-contracts.js',
            'runtime/test-static-assets.js',
            'runtime/test-build-flow.js',
            'runtime/test-toolchain-pins.js'
          )
          foreach ($test in $tests) {
            Write-Host "Running $test"
            node $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check local-only dependency bootstrap shell syntax
        shell: bash
        run: |
          bash -n toolchains/ps5-homebrew-ui/tools/fetch-opengl-sdk.sh
          bash -n toolchains/ps5-homebrew-ui/tools/setup-native-dependencies.sh
          bash -n toolchains/ps5-homebrew-ui/tools/setup-pacbrew-dependencies.sh
          bash -n toolchains/ps5-homebrew-ui/tools/setup-test-dependencies.sh
          bash -n toolchains/ps5-native-app-boilerplate/tools/setup-native-dependencies.sh
          bash -n toolchains/PS5_Vulkan/tools/setup-native-dependencies.sh
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $paths = @(
            'runtime/server.ps1',
            'runtime/native-runtime.ps1',
            'runtime/check-syntax.ps1',
            'runtime/test-native-runtime.ps1',
            'runtime/native-modification-policy.ps1',
            'runtime/test-native-modification-policy.ps1',
            'runtime/Build-ToolchainPack.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}:{1}:{2}: {3}" -f $path, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $path"
          }
      - name: Test isolated native UI runtime profile
        shell: pwsh
        run: ./runtime/test-native-runtime.ps1
      - name: Test native modification permissions and audit trail
        shell: pwsh
        run: ./runtime/test-native-modification-policy.ps1
      - name: Prepare offline SDK bundle for the recovery branch
        if: github.event_name == 'pull_request' && github.head_ref == 'offline-build-recovery-20261021'
        shell: pwsh
        env:
          SDK_TAG: v1.0.2
          SDK_SHA256: 30d8e51dd062739b629346102be5932728ba714bc50b1bdcdf08306c8843d9a4
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://api.github.com/repos/blackbearreloaded/ps5-opengl/releases/tags/$env:SDK_TAG"
          $release = Invoke-RestMethod -Uri $api -Headers @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'Visual-PS5-build' }
          $assets = @($release.assets | Where-Object { $_.name -like 'ps5-opengl-sdk-*.tar.gz' })
          if ($assets.Count -eq 0) {
            $names = ($release.assets | ForEach-Object { $_.name }) -join ', '
            throw "Release $env:SDK_TAG no contiene tarball del SDK. Assets publicados: $names"
          }
          $archive = Join-Path $env:RUNNER_TEMP 'ps5-opengl-sdk-1.0.2.tar.gz'
          $verified = $false
          foreach ($asset in $assets) {
            $candidate = Join-Path $env:RUNNER_TEMP ('sdk-candidate-' + $asset.name)
            try {
              Write-Host "Checking official SDK asset: $($asset.name)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $candidate | Out-Null
              $actual = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -eq $env:SDK_SHA256) {
                Move-Item -LiteralPath $candidate -Destination $archive -Force
                $verified = $true
                break
              }
              Write-Warning "SHA-256 mismatch on $($asset.name): $actual; discarded."
              Remove-Item -LiteralPath $candidate -Force
            } catch {
              Write-Warning "Cannot download $($asset.name): $($_.Exception.Message)"
              Remove-Item -LiteralPath $candidate -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not $verified) { throw "No asset in release $env:SDK_TAG matches pinned SHA-256 $env:SDK_SHA256." }
          $sourceZip = Join-Path $env:RUNNER_TEMP 'PS5-Homebrew-Studio-source.zip'
          git archive --format=zip --prefix=PS5-Homebrew-Studio/ --output=$sourceZip HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed: $LASTEXITCODE" }
          $bundle = Join-Path $PWD 'PS5-Homebrew-Studio-offline-bundle.zip'
          Copy-Item -LiteralPath $sourceZip -Destination $bundle
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($bundle, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $entryName = 'PS5-Homebrew-Studio/toolchains/ps5-opengl-sdk/ps5-opengl-sdk-1.0.2.tar.gz'
            $entry = $zip.CreateEntry($entryName, [System.IO.Compression.CompressionLevel]::NoCompression)
            $input = [System.IO.File]::OpenRead($archive)
            $output = $entry.Open()
            try { $input.CopyTo($output) } finally { $output.Dispose(); $input.Dispose() }
          } finally { $zip.Dispose() }
          Write-Host "Offline bundle staged; SDK SHA-256 verified: $env:SDK_SHA256"
      - name: Upload offline SDK bundle
        if: github.event_name == 'pull_request' && github.head_ref == 'offline-build-recovery-20261021'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PS5-Homebrew-Studio-offline-bundle
          path: PS5-Homebrew-Studio-offline-bundle.zip
          if-no-files-found: error
          retention-days: 30
      - name: Package versioned source ZIP
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: git archive --format=zip --prefix=PS5-Homebrew-Studio/ --output=PS5-Homebrew-Studio-v1.1.19.zip HEAD
      - name: Upload versioned source ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PS5-Homebrew-Studio-v1.1.19
          path: PS5-Homebrew-Studio-v1.1.19.zip
          if-no-files-found: error
          retention-days: 30
