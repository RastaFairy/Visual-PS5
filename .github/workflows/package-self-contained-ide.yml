name: Package self-contained Visual PS5 IDE

on:
  push:
    branches: [offline-build-recovery-20261021]
    paths:
      - .github/workflows/package-self-contained-ide.yml
      - runtime/**
      - toolchains/ps5-homebrew-ui/tools/fetch-opengl-sdk.sh

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out IDE source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the verified OpenGL SDK archive
        uses: actions/download-artifact@v4
        with:
          name: recovered-ps5-opengl-sdk
          path: ${{ runner.temp }}/sdk-artifact
          repository: ${{ github.repository }}
          run-id: 39670367714
          github-token: ${{ github.token }}

      - name: Verify SDK pins
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sdk-artifact/ps5-opengl-sdk-1.0.2.tar.gz"
          test -s "$archive"
          printf '%s  %s\n' '8e6cf43c03f210b5cf31e232a16a16c4154163059eaf33f00de836bf003a8818' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/sdk-verify"
          tar -xzf "$archive" -C "$RUNNER_TEMP/sdk-verify"
          sdk="$RUNNER_TEMP/sdk-verify/ps5-opengl-sdk-1.0.2/sdk"
          test "$(sha256sum "$sdk/manifest.sha256" | cut -d' ' -f1)" = '700493a187604fa33b90b94416cb6faf702a4852de03e072eb79154faabd8d88'
          (cd "$sdk" && sha256sum --check --strict --quiet manifest.sha256)

      - name: Pack the tracked IDE with its SDK archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/Visual-PS5-offline-build-recovery-20261021-with-opengl-sdk"
          mkdir -p "$stage"
          git archive --format=tar HEAD | tar -xf - -C "$stage"
          mkdir -p "$stage/toolchains/ps5-opengl-sdk"
          cp "$RUNNER_TEMP/sdk-artifact/ps5-opengl-sdk-1.0.2.tar.gz" "$stage/toolchains/ps5-opengl-sdk/"
          cp "$RUNNER_TEMP/sdk-artifact/ps5-opengl-sdk-1.0.2.tar.gz.sha256" "$stage/toolchains/ps5-opengl-sdk/"
          printf '%s\n' \
            'PS5 OpenGL SDK 1.0.2 - local verified package' \
            'Archive SHA-256: 8e6cf43c03f210b5cf31e232a16a16c4154163059eaf33f00de836bf003a8818' \
            'SDK manifest SHA-256: 700493a187604fa33b90b94416cb6faf702a4852de03e072eb79154faabd8d88' \
            'Rebuilt from the pinned source snapshot in toolchains/ps5-opengl.' \
            'IDE verifies archive and manifest before use. No remote release is needed.' \
            'Not independently tested on a physical PS5.' > "$stage/toolchains/ps5-opengl-sdk/README.txt"
          output="$RUNNER_TEMP/Visual-PS5-offline-build-recovery-20261021-with-opengl-sdk.zip"
          (cd "$stage" && zip -qr "$output" .)
          sha256sum "$output" > "$output.sha256"
          ls -lh "$output" "$output.sha256"

      - name: Upload the self-contained IDE package
        uses: actions/upload-artifact@v4
        with:
          name: Visual-PS5-offline-build-recovery-with-opengl-sdk
          path: |
            ${{ runner.temp }}/Visual-PS5-offline-build-recovery-20261021-with-opengl-sdk.zip
            ${{ runner.temp }}/Visual-PS5-offline-build-recovery-20261021-with-opengl-sdk.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
