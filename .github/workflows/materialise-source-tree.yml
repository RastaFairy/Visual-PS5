name: Materialise verified source tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialise-source-tree.yml'
      - 'release/source-archive/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise-source:
    name: Verify archive and commit source files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archive and restore source folder
        shell: bash
        run: |
          set -euo pipefail
          expected='f6aa6aae6d5d58a1e5e2e3582d168f0e97f67e1d105938ed6039ba963b329d13'
          archive="$RUNNER_TEMP/PS5-Homebrew-Studio-v1.0.1.tar.xz"
          restored="$RUNNER_TEMP/restored-source"
          cat release/source-archive/part*.b64 | base64 --decode > "$archive"
          echo "$expected  $archive" | sha256sum --check -
          mkdir -p "$restored"
          tar -xJf "$archive" -C "$restored"
          source="$restored/PS5-Homebrew-Studio"
          test -f "$source/start.bat"
          test -f "$source/app.js"
          test -f "$source/runtime/server.ps1"
          grep -Fq '${sourceName}: $description' "$source/runtime/server.ps1"
          target="$GITHUB_WORKSPACE/PS5-Homebrew-Studio"
          if [ -e "$target" ]; then
            echo "Refusing to overwrite existing PS5-Homebrew-Studio/ directory." >&2
            exit 1
          fi
          cp -a "$source" "$target"

      - name: Commit restored source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- PS5-Homebrew-Studio
          if git diff --cached --quiet; then
            echo 'No source-tree changes to commit.'
            exit 0
          fi
          git commit -m 'release: materialise corrected PS5 Homebrew Studio v1.0.1 source tree'
          git push origin HEAD:main
