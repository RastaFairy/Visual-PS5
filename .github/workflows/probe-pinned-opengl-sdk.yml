name: Temporary probe for pinned OpenGL release URL
on:
  push:
    branches:
      - offline-build-recovery-20261021
    paths:
      - .github/workflows/probe-pinned-opengl-sdk.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check pinned release API and direct asset without downloading 226 MB
        shell: bash
        run: |
          set +e
          api='https://api.github.com/repos/blackbearreloaded/ps5-opengl/releases/tags/v1.0.2'
          asset='https://github.com/blackbearreloaded/ps5-opengl/releases/download/v1.0.2/ps5-opengl-sdk-1.0.2.tar.gz'
          for label_url in "api|$api" "direct_asset|$asset"; do
            label="${label_url%%|*}"
            url="${label_url#*|}"
            echo "=== $label ==="
            curl --silent --show-error --location --head --max-time 60 \
              --output /dev/null \
              --write-out 'http=%{http_code} redirects=%{num_redirects} final=%{url_effective}\n' \
              "$url"
            echo "curl_exit=$?"
          done
