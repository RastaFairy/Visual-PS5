name: Vendorizar fuentes de toolchains PS5

on:
  push:
    branches:
      - toolchains-vendoring-audit-20261020
    paths:
      - '.github/workflows/vendor-toolchains.yml'
      - '.github/scripts/vendor-toolchains.sh'
      - 'toolchains/REPOSITORIOS.es-ES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Preparar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y git rsync python3

      - name: Copiar fuentes en el propio repositorio
        run: bash .github/scripts/vendor-toolchains.sh

      - name: Guardar los snapshots
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchains
          if git diff --cached --quiet; then
            echo "No hay cambios de toolchains para guardar."
            exit 0
          fi
          git commit -m "Vendorizar fuentes PS5 en toolchains [skip toolchain vendor]"
          git push origin "HEAD:${BRANCH_NAME}"
