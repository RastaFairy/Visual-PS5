name: Vendorizar fuentes de toolchains PS5

on:
  push:
    branches:
      - main
      - toolchains-vendoring-audit-20261020
    paths:
      - '.github/scripts/vendor-toolchains.sh'
      - '.github/scripts/recover-ps5-upstream-snapshots.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Preparar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y git rsync python3 curl

      - name: Validar sintaxis del script
        run: |
          bash -n .github/scripts/vendor-toolchains.sh
          bash -n .github/scripts/recover-ps5-upstream-snapshots.sh

      - name: Copiar fuentes en el propio repositorio
        run: bash .github/scripts/vendor-toolchains.sh

      - name: Recuperar los submódulos y snapshots históricos FSR4/HelixSR
        run: bash .github/scripts/recover-ps5-upstream-snapshots.sh

      - name: Guardar los snapshots
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Vendored source trees contain their own upstream .gitignore files.
          # Force-stage the pinned checkout contents so upstream-tracked files that
          # match those ignore patterns are not silently omitted from the snapshot.
          # The workflow checks out a clean repo and the sync scripts copy clean
          # Git trees, not build caches or local working files.
          git add -f toolchains
          if git diff --cached --quiet; then
            echo "No hay cambios de toolchains para guardar."
            exit 0
          fi
          git commit -m "Vendorizar fuentes PS5 en toolchains [skip toolchain vendor]"
          git push origin "HEAD:${BRANCH_NAME}"
